# Gateway: static SPA + load-balanced API/WebSocket traffic.
# No sticky sessions needed: any server instance can serve any client, because
# instances sync through Redis (see docs/DESIGN.md).
upstream syncpad_servers {
    least_conn;
    server server1:4000;
    server server2:4000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://syncpad_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://syncpad_servers;
    }

    location /collab/ {
        proxy_pass http://syncpad_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # long-lived sockets; the server pings every 30s
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
